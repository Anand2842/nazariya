<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Example agency website · Nazariya embed demo</title>
<style>
  :root { --ink:#1f2937; --brand:#7c3aed; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); background:#f8fafc; }
  header { background:#fff; border-bottom:1px solid #e5e7eb; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
  header b { color: var(--brand); font-size:20px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; display:grid; gap:20px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { main { grid-template-columns: 2fr 1fr; } }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:16px; }
  .rooms button { margin: 4px 6px 0 0; padding: 6px 10px; border-radius: 999px; border: 1px solid #d1d5db; background:#fff; cursor:pointer; }
  .rooms button.active { background: var(--brand); color:#fff; border-color: var(--brand); }
  #log { white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; background:#0f172a; color:#a7f3d0; border-radius:10px; padding:10px; height:160px; overflow:auto; }
  .note { font-size: 12px; color:#6b7280; }
</style>
</head>
<body>
  <header><b>Skyline Homes</b><span class="note">Example customer website (fictional) embedding a Nazariya tour</span></header>
  <main>
    <section>
      <h1 id="title" style="margin:0 0 10px">Property tour</h1>
      <div id="tour" style="height:560px" data-testid="host-tour"></div>
      <p class="note">This page loads <code>/sdk/nazariya.js</code> and controls the tour from outside the iframe.</p>
    </section>
    <aside class="card">
      <h3 style="margin-top:0">Jump to a room</h3>
      <div class="rooms" id="rooms" data-testid="host-rooms"></div>
      <h3>View</h3>
      <div class="rooms"><button data-view="3d">3D</button><button data-view="360">360°</button><button data-view="photos">Photos</button></div>
      <h3>Events</h3>
      <div id="log" data-testid="host-log"></div>
    </aside>
  </main>
  <script src="/sdk/nazariya.js"></script>
  <script>
    var space = new URLSearchParams(location.search).get("space");
    var log = function (m) { var el = document.getElementById("log"); el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };
    if (!space) { document.getElementById("tour").textContent = "Add ?space=<public id> to the URL (copy it from the Studio)."; }
    else {
      var tour = Nazariya.embed("#tour", { space: space });
      tour.on("ready", function (e) {
        document.getElementById("title").textContent = e.title;
        log("ready: " + e.rooms.length + " rooms");
        var box = document.getElementById("rooms");
        e.rooms.forEach(function (r, i) {
          var b = document.createElement("button");
          b.textContent = r.label; b.dataset.room = r.id;
          b.onclick = function () { tour.goToRoom(r.id); };
          box.appendChild(b);
        });
      });
      tour.on("start", function (e) { log("start: " + e.room + " (" + e.tier + ")"); });
      tour.on("roomchange", function (e) {
        log("roomchange: " + e.label);
        document.querySelectorAll("#rooms button").forEach(function (b) { b.classList.toggle("active", b.dataset.room === e.id); });
      });
      tour.on("viewchange", function (e) { log("viewchange: " + e.view); });
      tour.on("hotspotclick", function (e) { log("hotspot: " + e.title); });
      tour.on("error", function (e) { log("fallback: " + e.reason + " → " + e.fallback); });
      document.querySelectorAll("[data-view]").forEach(function (b) { b.onclick = function () { tour.setView(b.dataset.view); }; });
    }
  </script>
</body>
</html>
